<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projekte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1330">
<title>Projekte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0F1330; --text:#F2F4FF; --muted:rgba(242,244,255,.72);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text)}
body{font:400 16px/1.4 Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* Licht im Hintergrund */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform}
.b1{width:340px;height:340px;left:-120px;top:-90px;background:#3F6BFF;animation:drift1 16s ease-in-out infinite alternate}
.b2{width:300px;height:300px;right:-130px;top:260px;background:#D946EF;animation:drift2 19s ease-in-out infinite alternate}
.b3{width:320px;height:320px;left:-60px;bottom:-140px;background:#F59E0B;opacity:.5;animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,180px) scale(1.25)}}
@keyframes drift2{from{transform:scale(1.1)}to{transform:translate(-140px,120px) scale(.85)}}
@keyframes drift3{from{transform:scale(.9)}to{transform:translate(90px,-220px) scale(1.2)}}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:40px 20px 48px}

/* Glas */
.glass{position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 24px 48px -24px rgba(3,4,20,.8)}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 1.6s cubic-bezier(.3,.7,.2,1) 1.4s 1 both;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.rise{animation:rise .95s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes rise{0%{opacity:0;transform:translateY(34px) scale(.9);filter:blur(14px)}100%{opacity:1;transform:none;filter:blur(0)}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.2) translateY(10px)}100%{opacity:1;transform:none}}

/* Kopf */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{margin:0 0 6px;font-size:15px;font-weight:500;color:var(--muted)}
h1{margin:0;font:800 40px/1.02 "Bricolage Grotesque",Geist,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#FFFFFF 0%,#C9D4FF 40%,#FFD9A0 70%,#FFFFFF 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 7s ease-in-out infinite alternate}
@keyframes hue{to{background-position:100% 0}}
.avatar{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;font:700 18px "Bricolage Grotesque",sans-serif;flex:none}
.count{margin:26px 2px 12px;font-size:15px;color:var(--muted)}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:26px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s cubic-bezier(.2,.9,.25,1.2)}
.tile:active{transform:scale(.95)}
.tile:focus-visible,.avatar:focus-visible,.addbtn:focus-visible,.search:focus-within{outline:3px solid #9DB4FF;outline-offset:3px}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.chip{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.arrow{transition:transform .3s ease}
.tile:hover .arrow{transform:translate(2px,-2px)}
.name{display:block;font:700 18px/1.15 "Bricolage Grotesque",sans-serif;position:relative;overflow-wrap:anywhere}
.sub{display:block;font-size:13px;color:rgba(242,244,255,.7);position:relative;margin-top:2px;overflow-wrap:anywhere}

.ej{grid-column:span 2;border-radius:30px;padding:20px;gap:18px;min-height:0}
.ej .chip{width:44px;height:44px;border-radius:14px;background:rgba(245,180,40,.22);border:1px solid rgba(255,214,120,.45)}
.ej-title{display:flex;align-items:center;gap:12px}
.ej .name{font-size:21px}
.balls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative}
.ball{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 17px "Bricolage Grotesque",sans-serif;background:linear-gradient(160deg,#FFE08A,#F5A524);color:#2A1C00;box-shadow:0 6px 16px -6px #F5A524}
.ball.e{background:linear-gradient(160deg,#6E8BFF,#3550D6);color:#fff;box-shadow:0 6px 16px -6px #3550D6}
.vsep{width:1px;height:26px;background:rgba(255,255,255,.3);margin:0 3px}
.ej-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;font-size:14px;color:var(--muted)}
.ej-foot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.empty{margin:28px 4px;color:var(--muted)}
.badge{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B30;color:#fff;font:700 13px/22px Geist,-apple-system,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(15,19,48,.85),0 6px 14px -4px rgba(255,59,48,.8);animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}

/* Diesel-Kachel */
@font-face{font-family:DSEG7;src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2");font-display:swap}
.ds{grid-column:span 2;border-radius:30px;padding:20px;gap:16px;min-height:0;cursor:pointer}
.ds .chip{width:44px;height:44px;border-radius:14px;background:rgba(255,92,80,.2);border:1px solid rgba(255,150,130,.45)}
.ds .name{font-size:21px}
.ds-refresh{display:grid;place-items:center}
.ds.laedt .ds-refresh svg{animation:dsdreh 1s linear infinite}
@keyframes dsdreh{to{transform:rotate(360deg)}}
.ds-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.ds-station{font-size:14px;color:var(--muted);min-width:0}
.ds-station b{display:block;color:var(--text);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4CD98A;margin-right:6px;vertical-align:1px;animation:dsblink 1.8s ease-in-out infinite}
@keyframes dsblink{50%{opacity:.3}}
.lcd{font:700 42px/1 DSEG7,"Bricolage Grotesque",monospace;letter-spacing:1px;color:#fff;text-shadow:1px 1px 1px #E24B4A;white-space:nowrap;flex:none}
.lcd sup{font-size:.5em;vertical-align:top;position:relative;top:.05em;margin-left:1px}
.lcd .eur{font:600 .42em Geist,sans-serif;margin-left:5px;text-shadow:none}
.ds-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:relative}
.ds-slot{border-radius:18px;padding:10px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);min-width:0}
.ds-slot small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.ds-slot .lcd{font-size:22px}
.ds-slot .ort{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.ds-leer{font:700 22px "Bricolage Grotesque",sans-serif;color:var(--muted)}
.ds-fehler{color:#FF8A7E}
@media (prefers-reduced-motion: reduce){.ds-dot,.ds.laedt .ds-refresh svg{animation:none}}

/* Gruppen */
.group{grid-column:span 2;border-radius:30px;padding:14px;display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:center;gap:12px;position:relative}
.group-head .chip{width:44px;height:44px;border-radius:14px}
.group-head h2{margin:0;font:700 21px/1.15 "Bricolage Grotesque",sans-serif}
.group-grid{display:grid;gap:8px;position:relative}
.sub-tile{border-radius:20px;padding:10px;min-height:112px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.sub-tile:hover{background:rgba(255,255,255,.11)}
.sub-tile .chip{width:36px;height:36px;border-radius:12px}
.sub-tile .name{font-size:15px}
.sub-tile .name,.sub-tile .sub{overflow-wrap:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-tile .sub{font-size:11px}

/* Dock */
.dock{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:10px;max-width:528px;margin:0 auto}
.search{flex:1;height:56px;border-radius:28px;display:flex;align-items:center;gap:10px;padding:0 18px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:400 17px Geist,sans-serif;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(240,243,255,.62)}
.addbtn{width:56px;height:56px;border-radius:28px;display:grid;place-items:center;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){.blob,.glass::after,.rise,.pop,h1{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<main>
  <header class="rise">
    <div>
      <p class="date" id="date"></p>
      <h1 id="hello">Hallo</h1>
    </div>
    <a class="glass avatar" id="profil" href="#" aria-label="GitHub-Profil öffnen">S</a>
  </header>

  <p class="count rise" id="count" style="animation-delay:120ms"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Kein Projekt gefunden. Suchbegriff ändern.</p>
</main>

<script>
(function(){
  // ===== Konfiguration =====
  const GITHUB_USER = 'svenkutscher-prog';
  let NAME = 'Sabine';                                 // wird von "name" in projekte.json überschrieben
  // Repo-Name aus der Adresse: …github.io/<repo>/ oder die Haupt-Seite <user>.github.io
  const STARTSEITE_REPO = location.pathname.split('/').filter(Boolean)[0] || (GITHUB_USER + '.github.io');
  const EJ_URL = '/eurojackpot-check/';                 // Eurojackpot-App (gleiche Domain)
  const EJ_DATEN = '/eurojackpot-check/ziehungen.json';
  // Energie-Dashboard: gleiche Datenquelle wie im Dashboard selbst
  const ENERGIE_API = 'https://script.google.com/macros/s/AKfycbxvXeeBPFz7J7rvIV6zGa6Dllq--a53RBE4Lbq49d6jqokph8GEt9PeWR1GR6_EJUoQjw/exec';
  const ENERGIE_CACHE = 'wagael_v3';
  // myplan: offene Einträge der Einkaufsliste (gleiche Airtable-Daten wie in myplan)
  const MYPLAN = {
    base: 'appMXs8muaZVg3xxN',
    token: 'patxRn3XE4fIDytHi.21480c9d52102110c8d7d8fcc9f791cc4eb7402d079db12b22a20d1d8c5db7cd',
    tabelle: 'ShoppingNeeds',
    cache: 'nouriDataCache_v1',
    ziel: '#einkaufen'
  };
  // Diesel: günstigster offener Preis im Umkreis (Mittelpunkt Linnich/Aachen), Tankerkönig-API
  const DIESEL = {
    key: 'c5e49ed8-d412-d598-7f86-e87609a12d6e',
    lat: 50.878, lng: 6.177, rad: 15,                   // Radius in km (max. 25)
    cache: 'diesel_linnich_v1',
    tage: 14,                                           // so viele Tage merken
    intervall: 36e5                                     // automatisch stündlich, solange die Seite offen ist
  };

  const ICONS = {
    kalender:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
    code:'M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14',
    blitz:'M13 2L4 14h7l-1 8 9-12h-7z',
    rechner:'M6 3h12v18H6zM9 7h6M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01',
    puls:'M3 12h4l2-6 4 12 2-6h6',
    karte:'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14',
    ordner:'M3 6h6l2 2h10v11H3z',
    stern:'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z',
    kamera:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
    globus:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
    blende:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM14.3 3.3L9 12M20.6 8.5H10.2M18.9 17.5l-5.6-8.8M9.7 20.7l5.3-9.2M3.4 15.5h10.4M5.1 6.5l5.6 8.8',
    zapfsaeule:'M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M7 8h4M14 10h2a2 2 0 0 1 2 2v4.5a1.5 1.5 0 0 0 3 0V8l-3-3',
    neuladen:'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7'
  };
  const ARROW='<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(242,244,255,.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';
  const $=id=>document.getElementById(id);

  let projekte=[], gruppen=[], ziehung=null, q='', erstesRender=true, energieDatum='', einkaufOffen=0;

  // Kopfzeile
  $('profil').href='https://github.com/'+GITHUB_USER;
  function kopf(){
    const now=new Date(), h=now.getHours();
    const g=h<11?'Guten Morgen':h<17?'Hallo':h<22?'Guten Abend':'Gute Nacht';
    $('hello').replaceChildren(g+',',document.createElement('br'),NAME);
    $('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  }

  // Hilfen
  const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
  const svg=(path,color,size)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${path}"/></svg>`;
  const hex=c=>/^#[0-9a-fA-F]{6}$/.test(c)?c:'#5B8CFF';
  function hell(c){ // hellere Variante für Icon-Strich
    const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=v=>Math.round(v+(255-v)*.6);
    return `rgb(${m(r)},${m(g)},${m(b)})`;
  }

  // Countdown bis zur Freitagsziehung (ca. 20:00)
  function naechsterSchluss(now){
    for(let i=0;i<8;i++){const d=new Date(now);d.setDate(now.getDate()+i);d.setHours(20,0,0,0);if(d.getDay()===5&&d>now)return d}
  }
  function countdownText(){
    const now=new Date(), d=naechsterSchluss(now); if(!d) return '';
    const ms=d-now, t=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60, z=n=>String(n).padStart(2,'0');
    return t>=1?`${t} T ${z(h)} Std ${z(m)} Min`:`${z(h)}:${z(m)}:${z(s)}`;
  }

  function ejKachel(delay){
    const a=el('a','glass tile ej rise'); a.href=EJ_URL; a.style.animationDelay=delay+'ms';
    a.setAttribute('aria-label','Eurojackpot-Check öffnen');
    const glow=el('div','glow'); Object.assign(glow.style,{width:'220px',height:'220px',right:'-60px',top:'-90px',background:'radial-gradient(circle, rgba(245,180,40,.55), rgba(245,180,40,0) 70%)'}); a.append(glow);
    const row=el('div','row'); row.style.alignItems='center';
    const t=el('div','ej-title');
    const chip=el('span','chip'); chip.innerHTML=svg('M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4zM21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z','#FFD27A',22);
    const txt=el('div'); txt.append(el('span','name','Eurojackpot'));
    txt.append(el('span','sub',ziehung?'Letzte Ziehung: '+new Date(ziehung.date+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}):'Zahlen werden geladen …'));
    t.append(chip,txt); row.append(t); row.insertAdjacentHTML('beforeend',ARROW); a.append(row);
    if(ziehung){
      const b=el('div','balls');
      ziehung.n.forEach((n,i)=>{const s=el('span','ball pop',n);s.style.animationDelay=(700+i*90)+'ms';b.append(s)});
      b.append(el('span','vsep'));
      ziehung.e.forEach((n,i)=>{const s=el('span','ball e pop',n);s.style.animationDelay=(1150+i*90)+'ms';b.append(s)});
      a.append(b);
    }
    const foot=el('div','ej-foot');
    const left=el('span'); left.append('Nächste Ziehung in ');
    const cd=el('b',null,countdownText()); cd.id='cd'; left.append(cd);
    foot.append(left); a.append(foot);
    return a;
  }

  // ===== Diesel-Kachel =====
  let diesel={aktuell:null,tage:{}}, dieselLaedt=false, dieselFehler='', dieselZuletzt=0;
  try{const c=JSON.parse(localStorage.getItem(DIESEL.cache)||'null');if(c&&c.tage)diesel=c}catch(e){}
  const tagIso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const preisHtml=p=>{const s=p.toFixed(3);return s.slice(0,-1)+'<sup>'+s.slice(-1)+'</sup>'};
  const ortSchoen=o=>String(o||'').trim().toLowerCase().replace(/(^|[\s-])\S/g,c=>c.toUpperCase());
  const ruhig=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

  function dieselKachel(delay){
    const a=el('a','glass tile ds rise'); a.href='#diesel'; a.id='diesel'; a.style.animationDelay=delay+'ms';
    a.setAttribute('aria-label','Diesel-Preis jetzt aktualisieren');
    const glow=el('div','glow'); Object.assign(glow.style,{width:'240px',height:'240px',left:'-80px',bottom:'-140px',background:'radial-gradient(circle, rgba(255,92,80,.5), rgba(255,92,80,0) 70%)'}); a.append(glow);
    const row=el('div','row'); row.style.alignItems='center';
    const t=el('div','ej-title');
    const chip=el('span','chip'); chip.innerHTML=svg(ICONS.zapfsaeule,'#FFB3A6',22);
    const txt=el('div'); txt.append(el('span','name','Diesel'),el('span','sub','Linnich Richtung Aachen'));
    t.append(chip,txt); row.append(t);
    const r=el('span','ds-refresh'); r.innerHTML=svg(ICONS.neuladen,'rgba(242,244,255,.8)',20); row.append(r);
    a.append(row);
    const main=el('div','ds-main');
    const st=el('div','ds-station'); st.id='ds-station';
    const preis=el('div','lcd'); preis.id='ds-preis';
    main.append(st,preis); a.append(main);
    const slots=el('div','ds-slots');
    const v=el('div','ds-slot'); v.id='ds-v';
    const n=el('div','ds-slot'); n.id='ds-n';
    slots.append(v,n); a.append(slots);
    const foot=el('div','ej-foot');
    const stand=el('span'); stand.id='ds-stand';
    foot.append(stand,el('span',null,'Tippen zum Aktualisieren')); a.append(foot);
    a.addEventListener('click',e=>{e.preventDefault();ladeDiesel(true)});
    return a;
  }

  function dieselRollen(ziel,wert){ // Preis zählt wie eine Zapfsäule auf den Wert
    if(ruhig()){ziel.innerHTML=preisHtml(wert)+'<span class="eur">€</span>';return}
    const t0=performance.now(), start=wert+0.25;
    (function f(t){
      const k=Math.min((t-t0)/1000,1), e=1-Math.pow(1-k,3);
      ziel.innerHTML=preisHtml(start+(wert-start)*e)+'<span class="eur">€</span>';
      if(k<1) requestAnimationFrame(f);
    })(t0);
  }

  function dieselSlot(box,label,e,animieren){
    box.replaceChildren(el('small',null,e?`${label} · ${e.zeit} Uhr`:label));
    if(e){
      const p=el('div','lcd'); box.append(p);
      if(animieren) dieselRollen(p,e.preis); else p.innerHTML=preisHtml(e.preis)+'<span class="eur">€</span>';
      box.append(el('span','ort',`${e.name}, ${e.ort}`));
    }else box.append(el('span','ds-leer','–'));
  }

  function dieselZeigen(animieren){
    const k=$('diesel'); if(!k) return;
    k.classList.toggle('laedt',dieselLaedt);
    const a=diesel.aktuell, heute=diesel.tage[tagIso(new Date())]||{};
    const st=$('ds-station'), p=$('ds-preis');
    if(a){
      st.replaceChildren(el('b',null,a.name));
      const z=el('span'); if(a.datum===tagIso(new Date())){const d=el('span','ds-dot');d.setAttribute('aria-hidden','true');z.append(d)}
      z.append(`${a.ort}${a.km!=null?' · '+String(a.km).replace('.',',')+' km':''}`); st.append(z);
      if(animieren) dieselRollen(p,a.preis); else p.innerHTML=preisHtml(a.preis)+'<span class="eur">€</span>';
    }else{
      st.replaceChildren(el('span',null,dieselLaedt?'Preis wird geladen …':'Noch kein Preis'));
      p.innerHTML='<span class="ds-leer">–</span>';
    }
    dieselSlot($('ds-v'),'Vor 12 Uhr',heute.vor12,animieren);
    dieselSlot($('ds-n'),'Nach 12 Uhr',heute.nach12,animieren);
    const s=$('ds-stand');
    s.className=dieselFehler?'ds-fehler':'';
    if(dieselFehler) s.textContent=dieselFehler;
    else if(dieselLaedt) s.textContent='Wird aktualisiert …';
    else if(a) s.textContent=`Stand ${new Date(a.datum+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}, ${a.zeit} Uhr`;
    else s.textContent='';
  }

  async function ladeDiesel(manuell){
    if(dieselLaedt) return;
    if(!manuell&&Date.now()-dieselZuletzt<10*6e4) return; // automatisch höchstens alle 10 Min
    dieselLaedt=true; dieselFehler=''; dieselZeigen(false);
    let ok=false;
    try{
      const u=`https://creativecommons.tankerkoenig.de/json/list.php?lat=${DIESEL.lat}&lng=${DIESEL.lng}&rad=${DIESEL.rad}&sort=price&type=diesel&apikey=${DIESEL.key}`;
      const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); if(!j.ok) throw new Error(j.message||'API-Fehler');
      const offen=(j.stations||[]).filter(s=>s.isOpen&&typeof s.price==='number'&&s.price>0).sort((x,y)=>x.price-y.price);
      if(!offen.length) throw new Error('gerade keine Tankstelle geöffnet');
      const s=offen[0], now=new Date(), tag=tagIso(now);
      const e={preis:s.price,zeit:now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),name:(s.brand||s.name||'Tankstelle').trim(),ort:ortSchoen(s.place),km:s.dist,datum:tag};
      const slot=now.getHours()<12?'vor12':'nach12';
      const t=diesel.tage[tag]||(diesel.tage[tag]={});
      if(!t[slot]||e.preis<t[slot].preis) t[slot]=e;      // günstigster Preis im Zeitfenster
      Object.keys(diesel.tage).sort().slice(0,-DIESEL.tage).forEach(k=>delete diesel.tage[k]);
      diesel.aktuell=e; dieselZuletzt=Date.now(); ok=true;
      try{localStorage.setItem(DIESEL.cache,JSON.stringify(diesel))}catch(x){}
    }catch(err){
      dieselFehler='Abruf fehlgeschlagen: '+(err&&err.message||'Netzwerkfehler');
    }
    dieselLaedt=false; dieselZeigen(ok);
  }

  function kachel(p,delay,klein){
    const a=el('a',klein?'tile sub-tile':'glass tile rise'); a.href=p.url; a.style.animationDelay=delay+'ms';
    const c=hex(p.farbe);
    if(!klein){const glow=el('div','glow'); Object.assign(glow.style,{width:'170px',height:'170px',right:'-70px',bottom:'-80px',background:`radial-gradient(circle, ${c}66, ${c}00 70%)`}); a.append(glow);}
    const row=el('div','row');
    const chip=el('span','chip'); chip.style.background=c+'33'; chip.style.border='1px solid '+c+'73';
    chip.innerHTML=svg(ICONS[p.icon]||ICONS.ordner,hell(c),klein?20:22);
    if(/\/myplan\//i.test(p.url)){a.dataset.myplan=p.url.replace(/#.*$/,'');a.dataset.name=p.name;chip.style.position='relative';setTimeout(()=>einkaufZeigen(),0)}
    row.append(chip); row.insertAdjacentHTML('beforeend',klein?ARROW.replace(/18/g,'16'):ARROW); a.append(row);
    const t=el('div'); t.style.position='relative';
    t.append(el('span','name',p.name)); if(p.beschreibung) t.append(el('span','sub',p.beschreibung));
    if(/energie-dashboard/i.test(p.url)){const i=el('span','sub energie-info',energieDatum?'Letzter Eintrag: '+energieDatum:'Daten werden geladen …');t.append(i)}
    a.append(t);
    return a;
  }

  function gruppenKarte(name,liste,delay){
    const meta=gruppen.find(g=>g.name===name)||{}, c=hex(meta.farbe||'#FF7AB6');
    const sec=el('section','glass group rise'); sec.style.animationDelay=delay+'ms';
    sec.setAttribute('aria-label',name);
    const g1=el('div','glow'); Object.assign(g1.style,{width:'260px',height:'260px',left:'-90px',bottom:'-150px',background:`radial-gradient(circle, ${c}80, ${c}00 70%)`});
    const g2=el('div','glow'); Object.assign(g2.style,{width:'200px',height:'200px',right:'-70px',top:'-100px',background:'radial-gradient(circle, rgba(255,184,107,.45), rgba(255,184,107,0) 70%)'});
    sec.append(g1,g2);
    const head=el('div','group-head');
    const chip=el('span','chip'); chip.style.background=c+'38'; chip.style.border='1px solid '+c+'80';
    chip.innerHTML=svg(ICONS[meta.icon]||ICONS.ordner,hell(c),22);
    const t=el('div'); t.append(el('h2',null,name));
    head.append(chip,t); sec.append(head);
    const gg=el('div','group-grid'); gg.style.gridTemplateColumns=`repeat(${Math.min(liste.length,3)}, minmax(0, 1fr))`;
    liste.forEach(p=>gg.append(kachel(p,0,true)));
    sec.append(gg);
    return sec;
  }

  function render(){
    const grid=$('grid'); grid.replaceChildren();
    const s=q.trim().toLowerCase(), passt=t=>!s||t.toLowerCase().includes(s);
    const zeigeEj=passt('eurojackpot lotto');
    const zeigeDs=passt('diesel tanken sprit preis');
    const liste=projekte.filter(p=>passt(p.name+' '+(p.beschreibung||'')+' '+(p.gruppe||'')));
    const einzeln=liste.filter(p=>!p.gruppe);
    const namen=[...new Set(liste.filter(p=>p.gruppe).map(p=>p.gruppe))];
    // Animation nur beim ersten Aufbau, beim Suchen ohne Verzögerung
    const d=i=>erstesRender?i:0;
    if(zeigeEj) grid.append(ejKachel(d(200)));
    if(zeigeDs){grid.append(dieselKachel(d(240)));dieselZeigen(erstesRender&&!!diesel.aktuell)}
    einzeln.forEach((p,i)=>grid.append(kachel(p,d(280+i*70))));
    namen.forEach((n,i)=>grid.append(gruppenKarte(n,liste.filter(p=>p.gruppe===n),d(340+einzeln.length*70+i*90))));
    if(!erstesRender) grid.querySelectorAll('.rise,.pop').forEach(n=>n.style.animation='none');
    const total=liste.length+(zeigeEj?1:0)+(zeigeDs?1:0);
    $('count').textContent=total===1?'1 Projekt':total+' Projekte';
    $('empty').hidden=total>0;
  }

  async function laden(){
    const [p,z]=await Promise.allSettled([
      fetch('projekte.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()),
      fetch(EJ_DATEN+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject())
    ]);
    if(p.status==='fulfilled'&&Array.isArray(p.value.projekte)){
      projekte=p.value.projekte.filter(x=>x&&x.name&&x.url);
      gruppen=Array.isArray(p.value.gruppen)?p.value.gruppen.filter(g=>g&&g.name):[];
      if(typeof p.value.name==='string'&&p.value.name.trim()){NAME=p.value.name.trim();kopf()}
    }
    if(z.status==='fulfilled'&&Array.isArray(z.value.draws)&&z.value.draws.length){
      ziehung=[...z.value.draws].sort((a,b)=>b.date.localeCompare(a.date))[0];
    }
    render(); erstesRender=false;
  }

  setInterval(()=>{const c=$('cd');if(c)c.textContent=countdownText()},1000);
  // Datum des letzten Datensatzes aus dem Energie-Dashboard
  function energieAus(db){
    const d=db&&Array.isArray(db.daily)&&db.daily.length?String(db.daily[db.daily.length-1].datum||'').trim():'';
    return d?d.charAt(0).toUpperCase()+d.slice(1).toLowerCase():'';
  }
  function energieZeigen(){
    document.querySelectorAll('.energie-info').forEach(n=>n.textContent=energieDatum?'Letzter Eintrag: '+energieDatum:'Keine Daten');
  }
  async function ladeEnergie(){
    try{const c=JSON.parse(localStorage.getItem(ENERGIE_CACHE)||'null');const d=energieAus(c&&c.data);if(d){energieDatum=d;energieZeigen()}}catch(e){}
    try{
      const r=await fetch(ENERGIE_API+'?_t='+Date.now()); // ohne Header, sonst blockiert iOS
      if(!r.ok) throw 0;
      const d=energieAus(await r.json()); if(d) energieDatum=d;
    }catch(e){}
    energieZeigen();
  }

  // Einkaufsliste aus myplan: rote Badge mit Anzahl offener Einträge
  function einkaufZeigen(){
    document.querySelectorAll('a[data-myplan]').forEach(a=>{
      const chip=a.querySelector('.chip'); if(!chip) return;
      let b=chip.querySelector('.badge');
      if(einkaufOffen>0){
        if(!b){b=el('span','badge');b.setAttribute('aria-hidden','true');chip.append(b)}
        b.textContent=einkaufOffen>99?'99+':einkaufOffen;
        a.href=a.dataset.myplan+MYPLAN.ziel;
        a.setAttribute('aria-label',`${a.dataset.name}: ${einkaufOffen} ${einkaufOffen===1?'Artikel':'Artikel'} auf der Einkaufsliste`);
      }else{
        if(b) b.remove();
        a.href=a.dataset.myplan; a.removeAttribute('aria-label');
      }
    });
  }
  async function ladeEinkauf(){
    try{ // sofort: Zwischenspeicher von myplan auf diesem Gerät
      const c=JSON.parse(localStorage.getItem(MYPLAN.cache)||'null');
      const l=c&&c.data&&c.data.shoppingNeeds;
      if(Array.isArray(l)){einkaufOffen=l.filter(x=>x&&x.status==='offen').length;einkaufZeigen()}
    }catch(e){}
    try{ // dann live aus Airtable
      let anzahl=0, offset='';
      do{
        const u=`https://api.airtable.com/v0/${MYPLAN.base}/${encodeURIComponent(MYPLAN.tabelle)}?pageSize=100&fields%5B%5D=Status&filterByFormula=${encodeURIComponent("{Status}='offen'")}`+(offset?'&offset='+offset:'');
        const r=await fetch(u,{headers:{Authorization:'Bearer '+MYPLAN.token}});
        if(!r.ok) throw 0;
        const j=await r.json(); anzahl+=(j.records||[]).length; offset=j.offset||'';
      }while(offset);
      einkaufOffen=anzahl; einkaufZeigen();
    }catch(e){}
  }

  setInterval(kopf,60000);
  setInterval(()=>ladeDiesel(false),DIESEL.intervall);
  kopf(); laden(); ladeEnergie(); ladeEinkauf(); ladeDiesel(false);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){ladeEinkauf();ladeEnergie();ladeDiesel(false)}});
})();
</script>
</body>
</html>
