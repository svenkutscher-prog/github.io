<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projekte">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1330">
<title>Projekte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0F1330; --text:#F2F4FF; --muted:rgba(242,244,255,.72);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--text)}
body{font:400 16px/1.4 Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* Licht im Hintergrund */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform}
.b1{width:340px;height:340px;left:-120px;top:-90px;background:#3F6BFF;animation:drift1 16s ease-in-out infinite alternate}
.b2{width:300px;height:300px;right:-130px;top:260px;background:#D946EF;animation:drift2 19s ease-in-out infinite alternate}
.b3{width:320px;height:320px;left:-60px;bottom:-140px;background:#F59E0B;opacity:.5;animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(120px,180px) scale(1.25)}}
@keyframes drift2{from{transform:scale(1.1)}to{transform:translate(-140px,120px) scale(.85)}}
@keyframes drift3{from{transform:scale(.9)}to{transform:translate(90px,-220px) scale(1.2)}}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:40px 20px 48px}

/* Glas */
.glass{position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 24px 48px -24px rgba(3,4,20,.8)}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 1.6s cubic-bezier(.3,.7,.2,1) 1.4s 1 both;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.rise{animation:rise .95s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes rise{0%{opacity:0;transform:translateY(34px) scale(.9);filter:blur(14px)}100%{opacity:1;transform:none;filter:blur(0)}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.2) translateY(10px)}100%{opacity:1;transform:none}}

/* Kopf */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.date{margin:0 0 6px;font-size:15px;font-weight:500;color:var(--muted)}
h1{margin:0;font:800 40px/1.02 "Bricolage Grotesque",Geist,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#FFFFFF 0%,#C9D4FF 40%,#FFD9A0 70%,#FFFFFF 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 7s ease-in-out infinite alternate}
@keyframes hue{to{background-position:100% 0}}
.avatar{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;font:700 18px "Bricolage Grotesque",sans-serif;flex:none}
.kopf-btns{display:flex;gap:10px;flex:none}
.neu-btn{border:0;color:inherit;font:inherit;padding:0}
.neu-btn:focus-visible{outline:3px solid #9DB4FF;outline-offset:3px}
.neu-btn.dreht svg{animation:dsdreh .8s linear infinite}
.count{margin:26px 2px 12px;font-size:15px;color:var(--muted)}

/* Kacheln */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:26px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s cubic-bezier(.2,.9,.25,1.2)}
.tile:active{transform:scale(.95)}
.tile:focus-visible,.avatar:focus-visible,.addbtn:focus-visible,.search:focus-within{outline:3px solid #9DB4FF;outline-offset:3px}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.chip{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.arrow{transition:transform .3s ease}
.tile:hover .arrow{transform:translate(2px,-2px)}
.name{display:block;font:700 18px/1.15 "Bricolage Grotesque",sans-serif;position:relative;overflow-wrap:anywhere}
.sub{display:block;font-size:13px;color:rgba(242,244,255,.7);position:relative;margin-top:2px;overflow-wrap:anywhere}

.ej{grid-column:span 2;border-radius:30px;padding:20px;gap:18px;min-height:0}
.ej .chip{width:44px;height:44px;border-radius:14px;background:rgba(245,180,40,.22);border:1px solid rgba(255,214,120,.45)}
.ej-title{display:flex;align-items:center;gap:12px}
.ej .name{font-size:21px}
.balls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative}
.ball{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 17px "Bricolage Grotesque",sans-serif;background:linear-gradient(160deg,#FFE08A,#F5A524);color:#2A1C00;box-shadow:0 6px 16px -6px #F5A524}
.ball.e{background:linear-gradient(160deg,#6E8BFF,#3550D6);color:#fff;box-shadow:0 6px 16px -6px #3550D6}
.vsep{width:1px;height:26px;background:rgba(255,255,255,.3);margin:0 3px}
.ej-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;font-size:14px;color:var(--muted)}
.ej-foot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.empty{margin:28px 4px;color:var(--muted)}
.ej-ecke{position:absolute;right:0;bottom:0;width:68px;height:50px;border-top-left-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1;z-index:1;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
.ej-ecke b{font:700 22px/1 "Bricolage Grotesque",Geist,sans-serif}
.ej-ecke small{font-size:11px;margin-top:2px}
.ej-ecke.gruen{background:#2FA765}
.ej-ecke.rot{background:#E5372C}
.ej.mit-ecke .ej-foot{padding-right:58px}
.ej.mit-ecke .ej-foot b{white-space:nowrap}
.badge{position:absolute;top:-8px;right:-10px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B30;color:#fff;font:700 13px/22px Geist,-apple-system,sans-serif;text-align:center;box-shadow:0 0 0 2px rgba(15,19,48,.85),0 6px 14px -4px rgba(255,59,48,.8);animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}

/* Diesel-Kachel */
@font-face{font-family:DSEG7;src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2");font-display:swap}
.ds{grid-column:span 2;border-radius:30px;padding:18px;gap:14px;min-height:0;cursor:pointer}
.ds .chip{width:44px;height:44px;border-radius:14px;background:rgba(255,92,80,.2);border:1px solid rgba(255,150,130,.45)}
.ds .name{font-size:21px}
.ds-btn{background:transparent;border:0;color:inherit;padding:6px;margin:-6px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.ds-btn:focus-visible,.ds-link:focus-visible,.ds-sheet button:focus-visible{outline:3px solid #9DB4FF;outline-offset:2px}
.ds.laedt .ds-btn svg{animation:dsdreh 1s linear infinite}
@keyframes dsdreh{to{transform:rotate(360deg)}}
.ds-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:relative}
.ds-col{border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:10px 8px;min-width:0;display:flex;flex-direction:column;gap:2px;transition:border-color .4s,background .4s}
.ds-col.best{border:1.5px solid #4CD98A;background:rgba(76,217,138,.09)}
.ds-label{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-col.best .ds-label{color:#4CD98A}
.ds-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CD98A;margin-right:5px;vertical-align:1px;animation:dsblink 1.8s ease-in-out infinite}
.ds-dot.zu{background:#FF6B5E;animation:none}
@keyframes dsblink{50%{opacity:.3}}
.lcd{font:700 19px/1.1 DSEG7,"Bricolage Grotesque",monospace;letter-spacing:.5px;color:#fff;text-shadow:1px 1px 1px #E24B4A;white-space:nowrap;margin:5px 0 3px}
.lcd sup{font-size:.5em;vertical-align:top;position:relative;top:.05em;margin-left:1px}
.ds-hr{height:1px;background:rgba(255,255,255,.14);margin:3px 0}
.ds-mini{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ds-mini b{color:var(--text);font-weight:500}
.ds-leer{font:700 19px/1.1 "Bricolage Grotesque",sans-serif;color:var(--muted);margin:5px 0 3px}
.ds-fehler{color:#FF8A7E}
.ds-link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;padding:0;cursor:pointer}
/* Auswahl der Tankstellen */
.ds-overlay{position:fixed;inset:0;z-index:20;background:rgba(5,7,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.ds-sheet{width:100%;max-width:540px;max-height:82vh;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px;background-color:rgba(27,33,80,.88);animation:rise .5s cubic-bezier(.2,.9,.25,1.1) both}
.ds-sheet h2{margin:0;font:700 20px "Bricolage Grotesque",sans-serif}
.ds-seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;position:relative}
.ds-sheet button{font:inherit;color:inherit;cursor:pointer}
.ds-seg button{border-radius:14px;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);text-align:left;min-width:0}
.ds-seg button small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-seg button[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
.ds-sheet input{width:100%;font:400 16px Geist,sans-serif;color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;outline:none;position:relative}
.ds-liste{list-style:none;margin:0;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;position:relative}
.ds-liste button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.ds-liste button.gewaehlt{border-color:#4CD98A;background:rgba(76,217,138,.12)}
.ds-liste small{display:block;font-size:12px;color:var(--muted)}
.ds-liste .preis{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ds-zu{background:none;border:0;padding:6px;margin:-6px;border-radius:12px;display:grid;place-items:center}
@media (prefers-reduced-motion: reduce){.ds-dot,.ds.laedt .ds-btn svg,.ds-sheet{animation:none}}

/* Gruppen */
.group{grid-column:span 2;border-radius:30px;padding:14px;display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;align-items:center;gap:12px;position:relative}
.group-head .chip{width:44px;height:44px;border-radius:14px}
.group-head h2{margin:0;font:700 21px/1.15 "Bricolage Grotesque",sans-serif}
.group-grid{display:grid;gap:8px;position:relative}
.sub-tile{border-radius:20px;padding:10px;min-height:112px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.sub-tile:hover{background:rgba(255,255,255,.11)}
.sub-tile .chip{width:36px;height:36px;border-radius:12px}
.sub-tile .name{font-size:15px}
.sub-tile .name,.sub-tile .sub{overflow-wrap:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-tile .sub{font-size:11px}

/* Dock */
.dock{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:10px;max-width:528px;margin:0 auto}
.search{flex:1;height:56px;border-radius:28px;display:flex;align-items:center;gap:10px;padding:0 18px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:400 17px Geist,sans-serif;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(240,243,255,.62)}
.addbtn{width:56px;height:56px;border-radius:28px;display:grid;place-items:center;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){.blob,.glass::after,.rise,.pop,h1{animation:none}}
/* Profilbild + Katze auf der Eurojackpot-Kachel */
.avatar.foto{padding:3px;background:#FF7AB6}
.avatar.speichert{opacity:.5}
.avatar{cursor:pointer}
.avatar-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;font-size:0}
#katze{will-change:transform,opacity}
/* Minispiel "Fang die Maus" */
#hello{cursor:pointer}
.spiel{position:fixed;inset:0;z-index:50;background:rgba(15,19,48,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.spiel[hidden]{display:none}
.spiel-hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0;z-index:6}
.spiel-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:var(--text);font:600 14px Geist,sans-serif;padding:6px 12px;border-radius:15px;font-variant-numeric:tabular-nums}
.spiel-zu{width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);color:var(--text);font-size:18px;line-height:1;cursor:pointer}
#spielMaus{position:absolute;left:0;top:0;width:56px;height:46px;display:grid;place-items:center;cursor:pointer;z-index:3;opacity:0;transition:opacity .25s;will-change:transform}
#spielMaus svg{width:46px;height:33px}
.spiel-pfote{position:absolute;width:44px;height:44px;pointer-events:none;z-index:2;animation:spielPfote .6s ease-out forwards}
@keyframes spielPfote{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-14px)}}
.spiel-plus{position:absolute;color:#FFB86B;font:600 15px Geist,sans-serif;pointer-events:none;z-index:2;animation:spielPlus .7s ease-out forwards}
@keyframes spielPlus{to{opacity:0;transform:translateY(-24px)}}
.spiel-ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(15,19,48,.6)}
.spiel-ov[hidden]{display:none}
.spiel-titel{font:800 30px/1.1 "Bricolage Grotesque",Geist,sans-serif;margin:12px 0 8px}
.spiel-text{margin:0;max-width:280px;color:var(--muted);font-size:15px}
.spiel-rekord{margin:14px 0 0;color:#FFB86B;font-size:14px;font-weight:600}
.spiel-btn{margin-top:20px;background:#FF7AB6;color:#4B1528;border:none;font:600 16px Geist,sans-serif;padding:12px 30px;border-radius:24px;cursor:pointer}
.spiel-zahl{font:800 64px/1 "Bricolage Grotesque",Geist,sans-serif;margin:4px 0 6px}
.avatar.foto img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid var(--ground);display:block}
#katze{position:absolute;left:0;top:0;width:72px;height:52px;z-index:5;opacity:0;pointer-events:none;transition:opacity .4s}
#katze.da{opacity:1;pointer-events:auto;cursor:pointer}
#katze svg{display:block;width:72px;height:52px}
#katze .bein{transform-box:view-box}
#katze.laeuft .b1,#katze.laeuft .b4{animation:katzeSchritt .3s ease-in-out infinite alternate}
#katze.laeuft .b2,#katze.laeuft .b3{animation:katzeSchritt .3s ease-in-out infinite alternate-reverse}
@keyframes katzeSchritt{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
#katze .schwanz{transform-box:view-box;transform-origin:14px 38px;animation:katzeWedeln 1.1s ease-in-out infinite alternate}
@keyframes katzeWedeln{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}

/* Instagram-Kennzahlen (Gruppe fotoArtisan) */
.ig{display:block;position:relative;border-radius:20px;padding:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:inherit}
.ig:hover{background:rgba(255,255,255,.10)}
.ig:focus-visible{outline:3px solid #9DB4FF;outline-offset:3px}
.ig-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ig-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.ig-lbl{font-size:12px;color:var(--muted)}
.ig-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ig-kpi{border-radius:16px;padding:12px}
.ig-kpi b{display:block;font:700 34px/1 "Bricolage Grotesque",sans-serif}
.ig-kpi span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ig-kpi.ok{background:rgba(94,207,160,.12);border:1px solid rgba(94,207,160,.35)}
.ig-kpi.ok b{color:#8FE8C2}
.ig-kpi.offen{background:rgba(255,184,107,.12);border:1px solid rgba(255,184,107,.4)}
.ig-kpi.offen b{color:#FFD29A}
.ig-kpi.fertig{background:rgba(94,207,160,.12);border:1px solid rgba(94,207,160,.35)}
.ig-kpi.fertig b{color:#8FE8C2}
.ig-days{display:flex;gap:5px;margin-top:12px}
.ig-day{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.ig-day i{display:grid;place-items:center;height:30px;border-radius:9px;margin-bottom:4px;border:1px solid rgba(255,255,255,.14);font-style:normal;font-size:13px}
.ig-day.heute{color:#fff;font-weight:600}
.ig-day.heute i{border:1.5px solid #fff}
.ig-day.done i{background:rgba(94,207,160,.25);border-color:rgba(94,207,160,.5);color:#8FE8C2}
.ig-day.plan i{background:rgba(255,184,107,.18);border:1px dashed rgba(255,184,107,.6);color:#FFD29A}
/* Text fehlt / freier Rhythmus-Tag */
.ig-day.text i{background:rgba(255,184,107,.18);border:1px dashed rgba(255,184,107,.6);color:#FFD29A}
.ig-day.frei i{border:1px dashed rgba(255,255,255,.28)}
.ig-day.verpasst i{background:rgba(255,107,94,.15);border:1px dashed rgba(255,138,126,.6);color:#FF9A9A}
.ig-hr{height:1px;background:rgba(255,255,255,.12);margin:14px 0 6px}
.ig-wk{display:grid;grid-template-columns:52px minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.ig-bar{display:flex;gap:4px}
.ig-bar span{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.10)}
.ig-bar span.v{background:#8FE8C2}
.ig-wk em{font-style:normal;text-align:right}
.ig-foot{margin-top:12px;font-size:13px;color:rgba(242,244,255,.85)}
.ig-foot b{color:#FFD29A}
.ig-info{font-size:13px;color:var(--muted)}

/* WP-Kachel: Token-Countdown */
.wp-info{font-variant-numeric:tabular-nums}
.wp-info.bald{color:#FFD29A}
.wp-info.ab{color:#FF8A7E;font-weight:600}

/* Wärmepumpe & Sonne (ganz oben) – Stil wie das Wetter-Widget */
.wps{grid-column:1/-1;border-radius:30px;padding:20px;gap:14px;min-height:0;justify-content:flex-start}
.wps .chip{width:44px;height:44px;border-radius:14px;background:rgba(255,210,122,.2);border:1px solid rgba(255,214,120,.45)}
.wps .name{font-size:21px}
.wps-inhalt{position:relative}
.wps-body,.wps-l,.wps-r{display:flex;flex-direction:column;gap:12px}
.wps-body{gap:14px}
.wps-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wps-big{font:800 64px/1 "Bricolage Grotesque",Geist,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wps-big small{font-size:28px;font-weight:700;margin-left:2px}
.wps-lbl{font-size:15px;color:var(--muted)}
.wps-now{text-align:right;font-size:14px;color:var(--muted)}
.wps-now b{display:block;font:700 18px/1.2 "Bricolage Grotesque",sans-serif;color:var(--text);margin-top:4px}
.wps-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.12)}
.wps-bar i{display:block;height:100%}
.wps-sun{background:#FFD27A}
.wps-net{background:rgba(242,244,255,.42)}
.wps-leg{display:flex;justify-content:space-between;font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.wps-hr{height:1px;background:rgba(255,255,255,.16)}
.wps-tip{font-size:15px;display:flex;gap:8px;align-items:center}
.wps-hours{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;align-items:end;text-align:center}
.wps-h span{display:block;font-size:12px;color:var(--muted)}
.wps-h em{display:block;font-style:normal;font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wps-col{height:56px;width:12px;margin:6px auto 0;display:flex;flex-direction:column;justify-content:flex-end}
.wps-col i{display:block}
.wps-days{display:flex;flex-direction:column}
.wps-day{display:grid;grid-template-columns:58px minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.wps-day b{font-weight:600}
.wps-day .wps-bar{height:6px}
.wps-day em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.wps-info{font-size:14px;color:var(--muted)}
.wps-seg{display:flex;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:4px}
.wps-seg button{flex:1;min-width:0;border:0;border-radius:10px;padding:8px 4px;font:500 14px Geist,-apple-system,sans-serif;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wps-seg button.on{background:rgba(255,255,255,.2);color:var(--text);font-weight:600}
.wps-seg button:focus-visible,.wps-link:focus-visible{outline:3px solid #9DB4FF;outline-offset:2px}
.wps-link{display:grid;place-items:center;padding:6px;margin:-6px;border-radius:12px}
.wps-body2,.wps-l2{display:flex;flex-direction:column;gap:12px}
.wps-body2{gap:14px}
.wps-split{display:flex;height:24px;border-radius:8px;overflow:hidden;font:600 12px Geist,sans-serif}
.wps-split i{display:flex;align-items:center;padding-left:8px;font-style:normal;white-space:nowrap;overflow:hidden}
.wps-wp{background:#E2683A;color:#FFF1EA}
.wps-rest{background:rgba(120,130,200,.55);color:#E3E7F7}
.wps-tb{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));font-size:15px;font-variant-numeric:tabular-nums}
.wps-tb span{padding:8px 0;text-align:right}
.wps-tb .l{text-align:left}
.wps-tb .kopf{font-size:13px;color:var(--muted);padding-top:0}
.wps-tb .kopf.wp{color:#FFB08A}.wps-tb .kopf.hell{color:var(--text)}
.wps-tb .linie{border-bottom:1px solid rgba(255,255,255,.16)}
.wps-tb .stark{font-weight:600}
.wps-tb .sonne{color:#FFD27A}
.wps-tb .akku{color:#4CD98A}
.wps-tb .linie2{border-bottom:1px solid rgba(255,255,255,.35)}
.wps-tb .netz{font-weight:600;padding:10px 0}
.wps-tb .l.netz{color:#F4C0D1}
.wps-tb .gross{font:700 19px "Bricolage Grotesque",Geist,sans-serif}
.wps-tb .fuss{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:right;padding:2px 0 0}

.wps-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wps-d span{display:block;font-size:12px;color:var(--muted)}
.wps-d.heute span{color:var(--text);font-weight:600}
.wps-k{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;margin:8px auto 6px;font:700 15px "Bricolage Grotesque",sans-serif;font-style:normal;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.14)}
.wps-k.s1{background:rgba(242,244,255,.14);color:#E3E7F7}
.wps-k.s2{background:rgba(255,210,122,.22);color:#FFD27A;border-color:rgba(255,214,120,.4)}
.wps-k.s3{background:rgba(255,210,122,.5);color:#FFF1CF;border-color:rgba(255,214,120,.7)}
.wps-d.heute .wps-k{box-shadow:0 0 0 2px #fff}
.wps-bat{display:block;margin:8px auto 2px}
.wps-soc{display:block;font-size:12px;font-weight:500;color:rgba(242,244,255,.85);font-variant-numeric:tabular-nums}
.wps-d em{display:block;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wps-klein{font-size:12px;color:var(--muted)}

/* Obere Reihe: „Woher kam der Strom?“ + Waschmittel (Miele TwinDos) */
.topreihe{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.topreihe .wps{grid-column:auto}
.mlk{border-radius:30px;padding:16px;min-height:0;display:flex;flex-direction:row;align-items:center;gap:14px}
.mlk .chip{background:rgba(120,180,255,.2);border:1px solid rgba(150,200,255,.45);position:relative}
.mlk-kopf{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;gap:8px}
.mlk-ring{background:none;border:0;padding:0;margin:0;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;position:relative}
.mlk-ring:focus-visible,.mlk-link:focus-visible{outline:3px solid #9DB4FF;outline-offset:3px;border-radius:50%}
.mlk-ring svg{display:block;width:92px;height:92px}
.mlk-ring .v{transition:stroke-dasharray .7s cubic-bezier(.2,.9,.25,1),stroke .4s}
.mlk-dots{display:flex;gap:5px}
.mlk-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28)}
.mlk-dots i.on{background:#fff}
.mlk-txt{flex:1;min-width:0;position:relative}
.mlk-txt .sub{white-space:normal}
.mlk-txt .rot{color:#FF8A7E}
.mlk-txt .wechsel{animation:mlkFade .45s ease both}
@keyframes mlkFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mlk-link{display:grid;place-items:center;padding:6px;margin:-6px;border-radius:12px;position:relative}
@media (prefers-reduced-motion: reduce){.mlk-ring .v,.mlk-txt .wechsel{transition:none;animation:none}}

/* iPad mini: hochkant (ab 700 px) und quer (ab 1000 px) – breiter und größer */
@media (min-width:700px){
  main{max-width:740px;padding:48px 28px 56px}
  .dock{max-width:704px}
  .grid{gap:16px}
  .tile{min-height:150px;padding:20px}
  .name{font-size:20px}
  h1{font-size:46px}
  .sub-tile{min-height:120px;padding:14px}
  .sub-tile .name{font-size:17px}
  .group{padding:18px;gap:16px}
  .ig{padding:16px}
}
@media (min-width:1000px){
  main{max-width:1000px}
  .dock{max-width:964px}
  .tile{min-height:170px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}   /* 3 Kacheln nebeneinander */
  .ej,.ds,.group{grid-column:1/-1}                      /* breite Kacheln über die volle Breite */
  .wps-body2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:start}   /* Woher kam der Strom: zwei Spalten */
  .topreihe{grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:16px}   /* ¾ Strom · ¼ Waschmittel */
  .mlk{flex-direction:column;justify-content:space-between;text-align:center;padding:18px}
  .mlk-kopf{flex-direction:row;align-self:stretch;justify-content:space-between;align-items:center}
  .mlk-ring svg{width:116px;height:116px}
  .mlk-txt{flex:none}
}

  // ===== Diesel-Kachel =====
  // Spalte 1 und 2: feste Tankstellen (Auswahl auf diesem Gerät), Spalte 3: günstigste offene im Umkreis
  const DS_SPALTEN=['s1','s2','best'];
  let diesel={fest:[null,null],spalten:{s1:{},s2:{},best:{}},stationen:[]}, dieselLaedt=false, dieselFehler='', dieselZuletzt=0;
  try{const c=JSON.parse(localStorage.getItem(DIESEL.cache)||'null');if(c&&c.spalten)diesel=Object.assign(diesel,c)}catch(e){}
  const tagIso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const preisHtml=p=>{const s=p.toFixed(3);return s.slice(0,-1)+'<sup>'+s.slice(-1)+'</sup>'};

  function dieselRollen(ziel,wert){ // Preis zählt wie eine Zapfsäule auf den Wert
    if(ruhig()){ziel.innerHTML=preisHtml(wert);return}

    (function f(t){
      const k=Math.min((t-t0)/1000,1), e=1-Math.pow(1-k,3);
      ziel.innerHTML=preisHtml(start+(wert-start)*e);
      if(k<1) requestAnimationFrame(f);
    })(t0);
  }

  function dieselSpalte(key,animieren,minPreis){
    const box=$('ds-'+key); if(!box) return;

  function dieselZeigen(animieren){
    const k=$('diesel'); if(!k) return;
    k.classList.toggle('laedt',dieselLaedt);
    const heute=tagIso(new Date());
    const preise=DS_SPALTEN.map(s=>diesel.spalten[s]&&diesel.spalten[s].aktuell).filter(a=>a&&a.offen&&a.datum===heute&&typeof a.preis==='number').map(a=>a.preis);
    const minPreis=preise.length?Math.min(...preise):null;
    DS_SPALTEN.forEach(s=>dieselSpalte(s,animieren,minPreis));
    const s=$('ds-stand'), a=diesel.spalten.best&&diesel.spalten.best.aktuell;
    s.className=dieselFehler?'ds-fehler':'';
    if(dieselFehler) s.textContent=dieselFehler;
    else if(dieselLaedt) s.textContent='Wird aktualisiert …';
    else if(a) s.textContent=`Stand ${new Date(a.datum+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}, ${a.zeit} Uhr`;
    else s.textContent='';
  }

  function dieselMerken(key,st,now){
    const sp=diesel.spalten[key]||(diesel.spalten[key]={}), tag=tagIso(now);
    const alt=sp.aktuell&&sp.aktuell.id===st.id?sp.aktuell:null;
    const e={...st,zeit:now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),datum:tag};
    if(e.preis==null&&alt) e.preis=alt.preis;              // geschlossen: letzten bekannten Preis behalten
    sp.aktuell=e; sp.fehlt=false;
    if(st.offen&&typeof st.preis==='number'){
      sp.tage=sp.tage||{};
      const t=sp.tage[tag]||(sp.tage[tag]={}), slot=now.getHours()<12?'vor12':'nach12';
      if(!t[slot]||st.preis<t[slot].preis) t[slot]={preis:st.preis,zeit:e.zeit,name:st.name,ort:st.ort}; // günstigster im Zeitfenster
      Object.keys(sp.tage).sort().slice(0,-DIESEL.tage).forEach(k=>delete sp.tage[k]);
    }
  }

  async function ladeDiesel(manuell){
    if(dieselLaedt) return;
    if(!manuell&&Date.now()-dieselZuletzt<10*6e4) return; // automatisch höchstens alle 10 Min
    dieselLaedt=true; dieselFehler=''; dieselZeigen(false);
    let ok=false;
    try{
      const u=`https://creativecommons.tankerkoenig.de/json/list.php?lat=${DIESEL.lat}&lng=${DIESEL.lng}&rad=${DIESEL.rad}&sort=dist&type=diesel&apikey=${DIESEL.key}`;
      const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); if(!j.ok) throw new Error(j.message||'API-Fehler');
      const alle=(j.stations||[]).map(s=>({id:s.id,name:String(s.brand||s.name||'Tankstelle').trim(),
        strasse:`${s.street||''} ${s.houseNumber||''}`.trim(),ort:ortSchoen(s.place),km:s.dist,
        preis:typeof s.price==='number'&&s.price>0?s.price:null,offen:!!s.isOpen}));
      diesel.stationen=alle;
      // Vorgabe (Shell Linnich, Star Aldenhoven), solange noch nichts ausgewählt ist
      DIESEL.vorgabe.forEach((v,i)=>{
        if(diesel.fest[i]) return;
        const t=alle.find(s=>s.name.toLowerCase().includes(v.marke)&&s.ort.toLowerCase().includes(v.ort));
        if(t) diesel.fest[i]=t.id;
      });
      const now=new Date();
      diesel.fest.forEach((id,i)=>{
        const st=id&&alle.find(s=>s.id===id), key=DS_SPALTEN[i];
        if(st) dieselMerken(key,st,now); else (diesel.spalten[key]=diesel.spalten[key]||{}).fehlt=true;
      });
      const offen=alle.filter(s=>s.offen&&s.preis!=null).sort((x,y)=>x.preis-y.preis);
      if(offen.length) dieselMerken('best',offen[0],now);
      else dieselFehler='Gerade hat keine Tankstelle im Umkreis geöffnet';
      dieselZuletzt=Date.now(); ok=true; dieselSpeichern();
    }catch(err){
      dieselFehler='Abruf fehlgeschlagen: '+(err&&err.message||'Netzwerkfehler');
    }
    dieselLaedt=false; dieselZeigen(ok);
  }

    let spalte=0;
    const ov=el('div','ds-overlay'); ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Tankstellen wählen');

      liste.replaceChildren();

      treffer.forEach(st=>{

        const links=el('div'); links.append(el('span',null,st.name),el('small',null,`${st.strasse}, ${st.ort} · ${String(st.km).replace('.',',')} km`));

          const sp=diesel.spalten[DS_SPALTEN[spalte]]; if(!sp.aktuell) dieselMerken(DS_SPALTEN[spalte],st,new Date());

          if(spalte===0){spalte=1;const st2=diesel.stationen.find(x=>x.id===diesel.fest[1]);such.value=st2?st2.ort:ortSchoen(DIESEL.vorgabe[1].ort);segZeigen();listeZeigen()}

        });
        li.append(b); liste.append(li);

    such.addEventListener('input',listeZeigen);
    const st0=diesel.stationen.find(s=>s.id===diesel.fest[0]);

    segZeigen(); listeZeigen();

  }

  // ===== Instagram-Kennzahlen (Supabase-Tabelle insta_posts) =====
  function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function montag(d){const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
  function plusTage(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
  function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const j=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-j)/864e5+1)/7)}
  // Zugangsdaten NICHT aus GitHub: aus den Rechner-Einstellungen auf diesem Gerät (gleiche Domain)
  function instaZugang(){
    try{const s=JSON.parse(localStorage.getItem('ksp_settings')||'{}');
        const url=String(s.supabaseUrl||'').trim().replace(/\/+$/,''), key=String(s.supabaseKey||'').trim();
        return url&&key?{url,key}:null}catch(e){return null}
  }
  function instaOk(){return !!(insta&&instaZugang())}

  // Ziel/Woche aus dem Rhythmus der Instagram-App (Wochentage 0=So … 6=Sa, in projekte.json)
  function instaRhythmus(){const r=insta&&Array.isArray(insta.rhythmus)?insta.rhythmus.map(Number).filter(n=>n>=0&&n<=6):[];return r}
  function instaZiel(){const r=instaRhythmus();return r.length||Math.max(1,parseInt(insta&&insta.ziel)||3)}
  function instaLink(){const p=projekte.find(x=>x.gruppe===(insta&&insta.gruppe)&&/instagram\.com/i.test(x.url));return p?p.url:'https://www.instagram.com/'}

  // Liest nur Datum + Status aus der Tabelle „posts“ der Instagram-App (Lesezugriff ohne Anmeldung)
  async function instaLaden(){
    if(!instaOk()){instaZeigen();return}
    const zg=instaZugang(), mo=montag(new Date()), bis=plusTage(mo,5*7);
    const u=zg.url+'/rest/v1/posts?select=scheduled_at,status&scheduled_at=gte.'+encodeURIComponent(mo.toISOString())+'&scheduled_at=lt.'+encodeURIComponent(bis.toISOString());
    const h={apikey:zg.key}; if(zg.key.startsWith('eyJ')) h.Authorization='Bearer '+zg.key;
    try{
      const r=await fetch(u,{headers:h}); if(!r.ok) throw new Error('HTTP '+r.status);
      instaDaten=(await r.json()).filter(p=>p.scheduled_at).map(p=>({datum:ymd(new Date(p.scheduled_at)),status:p.status}));
      instaFehler=false;
    }catch(e){instaFehler=true}
    instaZeigen();
  }

  function instaBlock(){
    const a=el('a','ig'); a.href=instaLink(); a.setAttribute('aria-label','Instagram öffnen');
    a.innerHTML=instaHtml(); return a;
  }
  function instaZeigen(){document.querySelectorAll('.ig').forEach(n=>n.innerHTML=instaHtml())}

  function instaHtml(){
    const ziel=instaZiel(), rhy=instaRhythmus(), heute=new Date(), mo=montag(heute);

    const diese=inWoche(0), gepostet=diese.filter(p=>p.status==='veroeffentlicht').length, offen=Math.max(0,ziel-gepostet);

    h+='<div class="ig-hr"></div><div class="ig-lbl">Nächste 4 Wochen geplant</div>';

  // Foto quadratisch auf die Mitte zuschneiden und auf 256 px verkleinern
  function bildVerkleinern(file){
    return new Promise((ok,fehler)=>{
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{
        const s=Math.min(img.naturalWidth,img.naturalHeight), z=256, cv=document.createElement('canvas');
        cv.width=cv.height=z;
        cv.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,z,z);
        URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);fehler(new Error('Bild konnte nicht gelesen werden'))};
      img.src=url;
    });
  }

  // ===== Eurojackpot-Schein: gültige Wochen als Ecke auf der Kachel =====
  // Gleiche Daten wie die Eurojackpot-App (Supabase records, tbl = EJSchein; Zwischenspeicher "ej-schein")
  let ejSchein=null;
  const ejIso=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
  function ejScheinAus(f){
    if(typeof f==='string'){try{f=JSON.parse(f)}catch(e){return null}}
    if(!f) return null;
    if(ejIso(f.bis)) return f.bis;
    const w=parseInt(f.wochen,10);                       // altes Format: Abgabedatum + Wochen
    if(ejIso(f.abgabe)&&w>=1){const d=new Date(f.abgabe+'T12:00:00');d.setDate(d.getDate()+((5-d.getDay()+7)%7)+w*7);return tagIso(d)}
    return null;
  }
  function ejEcke(kachel){
    const a=kachel||document.querySelector('.tile.ej'); if(!a) return;
    const alt=a.querySelector('.ej-ecke'); if(alt) alt.remove();
    a.classList.toggle('mit-ecke',!!ejSchein);
    if(!ejSchein) return;
    const now=new Date(), bis=new Date(ejSchein+'T12:00:00'), ende=new Date(bis);
    if(bis.getDay()===5) ende.setHours(20,0,0,0); else ende.setHours(23,59,59,0);
    const heute=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0);
    const tage=Math.round((bis-heute)/864e5), abgelaufen=now>ende;
    let n=0; for(let d=new Date(heute);d<=bis;d.setDate(d.getDate()+1)){if(d.getDay()===5){const z=new Date(d);z.setHours(20,0,0,0);if(z>now)n++}}
    const e=el('div','ej-ecke '+(abgelaufen||tage<=7?'rot':'gruen'));
    if(abgelaufen) e.append(el('b',null,'Ende'));
    else e.append(el('b',null,String(n)),el('small',null,n===1?'Woche':'Wochen'));
    e.setAttribute('aria-hidden','true');
    if(abgelaufen) e.querySelector('b').style.fontSize='18px';
    a.append(e);
    a.setAttribute('aria-label',`Eurojackpot-Check öffnen – Schein ${abgelaufen?'abgelaufen':'noch '+n+(n===1?' Woche':' Wochen')+' gültig'}`);

  async function ladeSchein(){

  setInterval(kopf,60000);

  // ===== Wärmepumpe & Sonne: woher kam der Strom? (Heute · Gestern · 7 Tage · Monat) =====
  // Liest mit der WAGAEL-Anmeldung dieses Geräts (gleiche Domain) – ohne Anmeldung zeigt die Kachel einen Hinweis.
  // Haus: FoxESS-Zähler (Verbrauch wie in der FoxESS-App). Wärmepumpe: WAGAEL-Zähler, jeder Verbrauchsschritt bekommt
  // den Strom-Mix des Hauses zu dieser Zeit. Rest-Haus = Haus − Wärmepumpe.
  const WPS={url:'https://umkiprxcwqwhbudmvaci.supabase.co',key:'sb_publishable_kvmQTcpqL1AqEdIx51z47A_qjzOUZqu',
    session:'sb-umkiprxcwqwhbudmvaci-auth-token'};
  let wps=null, wpsStatus='laedt', wpsLaedt=false, wpsSel=0;
  try{wpsSel=Math.min(3,Math.max(0,parseInt(localStorage.getItem('wps_tab'))||0))}catch(e){}
  function wpsLink(){const p=projekte.find(x=>/\/wagaelv2/i.test(x.url));return (p?p.url.replace(/#.*$/,''):'/wagaelv2/')+'#solar'}

  async function wpsToken(){
    let s=null; try{s=JSON.parse(localStorage.getItem(WPS.session)||'null')}catch(e){}
    if(!s||!s.refresh_token) return null;
    if(s.access_token&&(s.expires_at||0)*1000>Date.now()+60e3) return s.access_token;
    try{ // abgelaufen: erneuern wie WAGAEL selbst und für WAGAEL zurückschreiben
      const r=await fetch(WPS.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:WPS.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok) return null;
      const n=await r.json(); if(!n.access_token) return null;
      n.expires_at=n.expires_at||Math.floor(Date.now()/1000)+(n.expires_in||3600);
      try{localStorage.setItem(WPS.session,JSON.stringify(n))}catch(e){}
      return n.access_token;
    }catch(e){return null}
  }
  async function wpsAlle(pfad,tok){ // PostgREST liefert max. 1000 Zeilen pro Abruf
    let out=[],off=0;
    while(true){
      const r=await fetch(`${WPS.url}/rest/v1/${pfad}&limit=1000&offset=${off}`,{headers:{apikey:WPS.key,Authorization:'Bearer '+tok}});
      if(r.status===401) throw new Error('login'); if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.json(); out=out.concat(t); if(t.length<1000||out.length>=30000) return out; off+=1000;
    }
  }
  // Herkunft des Hausstroms in einem Moment: Sonne direkt / Akku / Netz (zusammen 1)
  function wpsMix(p){
    if(!p||p.load_kw==null) return null;
    const L=Math.max(p.load_kw,0.01), c=v=>Math.min(1,Math.max(0,(v||0)/L)), g=c(p.grid_kw), bat=Math.min(c(p.bat_discharge_kw),1-g);
    return {sun:1-g-bat,bat,grid:g};
  }
  function wpsMixAt(pv,a,b){ // Mittel der PV-Messungen in [a,b], sonst nächste Messung (max. 6 Min.)
    let lo=0,hi=pv.length; while(lo<hi){const m=(lo+hi)>>1; if(pv[m].t<a) lo=m+1; else hi=m}
    const acc={sun:0,bat:0,grid:0}; let n=0;
    for(let i=lo;i<pv.length&&pv[i].t<=b;i++){const m=wpsMix(pv[i]);if(m){acc.sun+=m.sun;acc.bat+=m.bat;acc.grid+=m.grid;n++}}
    if(n) return {sun:acc.sun/n,bat:acc.bat/n,grid:acc.grid/n};
    const mid=(a+b)/2, c=[pv[lo],pv[lo-1]].filter(Boolean).sort((x,y)=>Math.abs(x.t-mid)-Math.abs(y.t-mid))[0];
    return c&&Math.abs(c.t-mid)<=6*6e4?wpsMix(c):null;
  }
  // Ein Zeitraum [a,b): Haus, Wärmepumpe, Rest-Haus – jeweils braucht / Sonne direkt / Akku / Netz (kWh)
  function wpsZeitraum(pv,hp,a,b){
    const inP=pv.filter(p=>p.t>=a&&p.t<b); if(inP.length<2) return null;
    const s=pv.filter(p=>p.t<a&&p.t>=a-36e5).pop()||inP[0], z=inP[inP.length-1];   // Zählerstand am Anfang (max. 1 Std. davor)
    const df=c=>s[c]!=null&&z[c]!=null?Math.max(0,z[c]-s[c]):null;
    const v=['pv_total_kwh','grid_total_kwh','feedin_total_kwh','bat_charge_total_kwh','bat_discharge_total_kwh'].map(df);
    if(v.some(x=>x==null)) return null;
    const [pvE,g,fe,bc,bd]=v, need=Math.max(0,pvE+g-fe-bc+bd);   // Verbrauch wie in der FoxESS-App
    const haus={need,grid:g,akku:bd,sun:Math.max(0,need-g-bd)};
    const wp={need:0,sun:0,akku:0,grid:0};
    for(let i=1;i<hp.length;i++){
      const x=hp[i-1], y=hp[i], gap=y.t-x.t;
      if(y.t<a||y.t>=b||x.energy_wh==null||y.energy_wh==null||gap>60*6e4) continue;   // außerhalb oder Datenlücke
      const wh=y.energy_wh-x.energy_wh; if(!(wh>0)) continue;
      const m=wpsMixAt(pv,y.t-Math.min(gap,5*6e4),y.t); if(!m) continue;              // nur Zeit mit PV-Daten
      const k=wh/1000; wp.need+=k; wp.sun+=k*m.sun; wp.akku+=k*m.bat; wp.grid+=k*m.grid;
    }
    const rest={}; for(const key of ['need','sun','akku','grid']) rest[key]=Math.max(0,haus[key]-wp[key]);
    return {wp,rest,haus,ab:inP[0].t};
  }
  async function ladeWPS(){
    if(wpsLaedt) return; wpsLaedt=true;
    try{
      const tok=await wpsToken(); if(!tok){wpsStatus='login';return}
      const h0=new Date(); h0.setHours(0,0,0,0);
      const w0=new Date(h0); w0.setDate(w0.getDate()-6);
      const g0=new Date(h0); g0.setDate(g0.getDate()-1);
      const m0=new Date(h0.getFullYear(),h0.getMonth(),1);
      const start=Math.min(w0.getTime(),m0.getTime()), F=new Date(start-36e5).toISOString();
      const [pvR,hpR]=await Promise.all([
        wpsAlle(`pv_snapshots?select=captured_at,fox_time,load_kw,grid_kw,bat_discharge_kw,pv_total_kwh,grid_total_kwh,feedin_total_kwh,bat_charge_total_kwh,bat_discharge_total_kwh&captured_at=gte.${F}&order=captured_at.asc`,tok),
        wpsAlle(`snapshots?select=captured_at,energy_wh&hp_valve=not.is.null&captured_at=gte.${F}&order=captured_at.asc`,tok)]);
      const pv=pvR.map(p=>({...p,t:new Date(p.fox_time||p.captured_at).getTime()})).sort((x,y)=>x.t-y.t);
      const hp=hpR.map(h=>({...h,t:new Date(h.captured_at).getTime()}));
      const now=Date.now(), dm=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'});
      const bisHeute=dm(h0);
      wps={stand:pv.length?pv[pv.length-1].t:null, p:[
        {name:'Heute', info:'', ...{x:wpsZeitraum(pv,hp,h0.getTime(),now+1)}, a:h0.getTime()},
        {name:'Gestern', info:g0.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'}), x:wpsZeitraum(pv,hp,g0.getTime(),h0.getTime()), a:g0.getTime()},
        {name:'7 Tage', info:`${dm(w0)}–${bisHeute}`, x:wpsZeitraum(pv,hp,w0.getTime(),now+1), a:w0.getTime()},
        {name:h0.toLocaleDateString('de-DE',{month:'long'}), info:`${dm(m0)}–${bisHeute}`, x:wpsZeitraum(pv,hp,m0.getTime(),now+1), a:m0.getTime()}]};
      wpsStatus='ok';
    }catch(e){wpsStatus=e.message==='login'?'login':'fehler'}
    finally{wpsLaedt=false;wpsZeigen()}
  }

  function wpsHtml(){
    if(wpsStatus==='login') return '<div class="wps-info">Auf diesem Gerät nicht bei WAGAEL angemeldet. Einmal in WAGAEL anmelden – dann erscheinen die Werte hier.</div>';
    if(!wps) return `<div class="wps-info">${wpsStatus==='fehler'?'Daten gerade nicht erreichbar.':'Daten werden geladen …'}</div>`;
    const P=wps.p[wpsSel], x=P.x;
    const seg='<div class="wps-seg" role="tablist">'+wps.p.map((p,i)=>`<button type="button" role="tab" aria-selected="${i===wpsSel}" class="${i===wpsSel?'on':''}" data-wps-p="${i}">${p.name}</button>`).join('')+'</div>';
    if(!x) return seg+'<div class="wps-info">Für diesen Zeitraum gibt es noch keine PV-Daten.</div>';
    const f=v=>(Math.round(v*10)/10).toLocaleString('de-DE',{minimumFractionDigits:v<100?1:0,maximumFractionDigits:v<100?1:0});
    const p=x.haus.need>0.05?Math.round(x.wp.need/x.haus.need*100):0;
    const zeile=(lbl,cls,k,gross)=>`<span class="l ${cls}">${lbl}</span>`+['wp','rest','haus'].map(s=>`<span class="${cls}${gross?' gross':''}">${f(x[s][k])}</span>`).join('');
    const netzWp=x.wp.need>0.05?Math.round(x.wp.grid/x.wp.need*100):null;
    const teil=x.ab-P.a>15*6e4?` · Daten erst ab ${new Date(x.ab).toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})} ${new Date(x.ab).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`:'';
    return `<div class="wps-body2"><div class="wps-l2">${seg}
      <div class="wps-split"><i class="wps-wp" style="width:${p}%">${p>=18?'Wärmepumpe '+p+' %':''}</i><i class="wps-rest" style="width:${100-p}%">${100-p>=18?'Rest-Haus '+(100-p)+' %':''}</i></div>
      <div class="wps-klein">${netzWp!=null?`Wärmepumpe ${netzWp} % aus dem Netz`:'Wärmepumpe lief noch nicht'}${teil}</div></div>
      <div class="wps-tb">
        <span></span><span class="kopf wp">Wärmepumpe</span><span class="kopf">Rest-Haus</span><span class="kopf hell">Haus gesamt</span>
        ${zeile('braucht','linie stark','need')}
        ${zeile('− Sonne direkt','sonne','sun')}
        ${zeile('− aus dem Akku','akku linie2','akku')}
        ${zeile('= Netz gekauft','netz','grid',true)}
        <span class="l fuss">alle Werte in kWh</span>
      </div></div>`;
  }
  function wpsKachel(delay){
    const a=el('div','glass tile wps rise'); a.style.animationDelay=delay+'ms';
    const glow=el('div','glow'); Object.assign(glow.style,{width:'240px',height:'240px',right:'-70px',top:'-110px',background:'radial-gradient(circle, rgba(255,200,90,.5), rgba(255,200,90,0) 70%)'}); a.append(glow);

  function wpsZeigen(){
    document.querySelectorAll('.wps-inhalt').forEach(n=>n.innerHTML=wpsHtml());
    const P=wps&&wps.p[wpsSel];
    document.querySelectorAll('.wps-sub').forEach(n=>n.textContent=!P?'Wärmepumpe und Haus':(P.info||(wps.stand?'Stand '+new Date(wps.stand).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr':'Heute')));

  setInterval(ladeWPS,5*6e4);           // alle 5 Min neu (wie die Erfassung)

  // ===== Waschmittel (Miele TwinDos) – Daten aus WAGAEL (Tabelle miele_snapshots), gleiche Anmeldung wie oben =====
  // Kreis zeigt einen Behälter; wechselt alle 5 s automatisch, Tippen schaltet selbst um (dann kein Automatik-Wechsel mehr).
  let ml=null, mlStatus='laedt', mlLaedt=false, mlSel=0, mlManuell=false, mlDash={};
  const ML_U=2*Math.PI*40;
  function mlEta(rows,key,now){ // Abnahme seit dem letzten Nachfüllen → Wäschen und Datum bis leer
    const pts=rows.filter(r=>r[key]!=null).map(r=>({t:new Date(r.captured_at),v:r[key]}));
    if(pts.length<2) return null;
    let st=0; for(let i=1;i<pts.length;i++) if(pts[i].v>pts[i-1].v+5) st=i;
    const seg=pts.slice(st), drop=seg[0].v-seg[seg.length-1].v, tage=(now-seg[0].t)/864e5;
    const wm=rows.filter(r=>new Date(r.captured_at)>=seg[0].t);
    let w=0; for(let i=0;i<wm.length;i++) if(wm[i].status_raw===5&&(i===0||wm[i-1].status_raw!==5)) w++;
    if(tage<3||drop<3||w<2) return {lernt:true};
    const cur=seg[seg.length-1].v;
    return {waeschen:Math.floor(cur/(drop/w)),bis:new Date(now.getTime()+cur/(drop/tage)*864e5)};
  }
  async function ladeML(){
    if(mlLaedt) return; mlLaedt=true;
    try{
      const tok=await wpsToken(); if(!tok){mlStatus='login';return}
      const F=new Date(Date.now()-120*864e5).toISOString();
      const [rows,stamm]=await Promise.all([
        wpsAlle(`miele_snapshots?select=captured_at,device_type,status_raw,program,remaining_min,twindos1_pct,twindos2_pct&captured_at=gte.${F}&order=captured_at.asc`,tok),
        wpsAlle(`hp_stammdaten?select=key,value&key=like.TwinDos*`,tok).catch(()=>[])]);
      const wm=rows.filter(r=>!/dryer|trockner/i.test(r.device_type||''));
      const now=new Date(), b=[];
      [1,2].forEach(nr=>{
        const key='twindos'+nr+'_pct', last=[...wm].reverse().find(r=>r[key]!=null);
        if(!last) return;
        const n=(stamm.find(x=>x.key==='TwinDos '+nr+' Inhalt')||{}).value||('TwinDos '+nr);
        b.push({nr,v:last[key],name:n,eta:mlEta(wm,key,now)});
      });
      const l=wm[wm.length-1];
      ml={b,run:l&&l.status_raw===5?{prog:l.program,rest:l.remaining_min}:null,fertig:!!(l&&l.status_raw===7)};
      if(!ml.b.length) mlStatus='leer';
      else{ if(!mlManuell||mlSel>=ml.b.length) mlSel=ml.b.reduce((m,x,i,a)=>x.v<a[m].v?i:m,0); mlStatus='ok'}
    }catch(e){mlStatus=e.message==='login'?'login':'fehler'}
    finally{mlLaedt=false;mlZeigen(false)}
  }
  function mlFarbe(v){return v<10?['#FF6B5E','#FF8A7E']:v<30?['#FFB86B','#FFD29A']:['#4CD98A','#8FE8C2']}
  function mlZeigen(wechsel){
    document.querySelectorAll('.mlk').forEach(a=>{
      const ring=a.querySelector('.mlk-ring'), txt=a.querySelector('.mlk-txt'), chip=a.querySelector('.chip');
      if(!ring||!txt) return;
      let badge=chip.querySelector('.badge');
      if(mlStatus!=='ok'){
        ring.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/></svg>`;
        txt.innerHTML=`<span class="name">Waschmittel</span><span class="sub">${mlStatus==='login'?'In WAGAEL anmelden – dann erscheinen die Werte hier.':mlStatus==='leer'?'Noch keine TwinDos-Werte.':mlStatus==='fehler'?'Daten gerade nicht erreichbar.':'Daten werden geladen …'}</span>`;
        if(badge) badge.remove(); return;
      }
      const x=ml.b[mlSel], [farbe,hellf]=mlFarbe(x.v), dash=Math.max(2,Math.min(100,x.v)/100*ML_U), alt=mlDash.a??dash;
      ring.setAttribute('aria-label',`${x.name}: ${x.v} Prozent${ml.b.length>1?' – tippen für den anderen Behälter':''}`);
      ring.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
        <circle class="v" cx="50" cy="50" r="40" fill="none" stroke="${farbe}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${alt} ${ML_U}" transform="rotate(-90 50 50)"/>
        <text x="50" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="${hellf}" font-family="Bricolage Grotesque,Geist,sans-serif">${Math.round(x.v)} %</text>
        <text x="50" y="68" text-anchor="middle" font-size="10" fill="rgba(242,244,255,.72)">TwinDos ${x.nr}</text></svg>
        ${ml.b.length>1?'<span class="mlk-dots">'+ml.b.map((_,i)=>`<i class="${i===mlSel?'on':''}"></i>`).join('')+'</span>':''}`;
      const c=ring.querySelector('.v'); requestAnimationFrame(()=>requestAnimationFrame(()=>c.setAttribute('stroke-dasharray',`${dash} ${ML_U}`)));
      mlDash.a=dash;
      const dm=d=>d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
      const zust=x.v<=0?'<span class="sub rot">leer – nachfüllen</span>':x.v<10?'<span class="sub rot">fast leer</span>':'';
      const eta=x.v<=0||!x.eta?'':x.eta.lernt?'<span class="sub">Restlaufzeit wird gelernt …</span>':`<span class="sub">noch ca. ${x.eta.waeschen} Wäsche${x.eta.waeschen===1?'':'n'} · bis ${dm(x.eta.bis)}</span>`;
      const ander=ml.b.find((_,i)=>i!==mlSel);
      const lauf=ml.run?`<span class="sub">läuft${ml.run.prog?' · '+ml.run.prog:''}${ml.run.rest!=null?' · noch '+Math.floor(ml.run.rest/60)+':'+String(ml.run.rest%60).padStart(2,'0'):''}</span>`:ml.fertig?'<span class="sub">Wäsche fertig – ausräumen</span>':'';
      txt.innerHTML=`<div class="${wechsel?'wechsel':''}"><span class="name">${x.name}</span>${zust}${eta}${ander?`<span class="sub">${ander.name} · ${Math.round(ander.v)} %</span>`:''}${lauf}</div>`;
      const rot=ml.b.some(y=>y.v<10);
      if(rot){if(!badge){badge=el('span','badge','!');badge.setAttribute('aria-hidden','true');chip.append(badge)}} else if(badge) badge.remove();
    });
  }
  function mlWeiter(manuell){
    if(mlStatus!=='ok'||!ml||ml.b.length<2) return;
    if(manuell) mlManuell=true;
    mlSel=(mlSel+1)%ml.b.length; mlZeigen(true);
  }
  function mlKachel(delay){
    const a=el('div','glass tile mlk rise'); a.style.animationDelay=delay+'ms';
    const glow=el('div','glow'); Object.assign(glow.style,{width:'200px',height:'200px',right:'-80px',bottom:'-100px',background:'radial-gradient(circle, rgba(110,160,255,.45), rgba(110,160,255,0) 70%)'}); a.append(glow);
    const kopfz=el('div','mlk-kopf');
    const chip=el('span','chip'); chip.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BFDBFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4.5"/><path d="M7 6h.01M10 6h.01"/></svg>';
    const link=el('a','mlk-link'); link.href=wpsLink().replace(/#.*$/,'')+'#overview'; link.setAttribute('aria-label','WAGAEL öffnen'); link.innerHTML=ARROW;
    kopfz.append(chip,link);
    const ring=el('button','mlk-ring'); ring.type='button';
    ring.addEventListener('click',()=>mlWeiter(true));
    const txt=el('div','mlk-txt');
    a.append(kopfz,ring,txt);
    setTimeout(()=>mlZeigen(false),0);
    return a;
  }
  setInterval(()=>{if(!mlManuell&&!document.hidden) mlWeiter(false)},5000);   // automatischer Wechsel
  setInterval(ladeML,5*6e4);


  kopf(); laden(); ladeEnergie(); ladeEinkauf(); ladeDiesel(false); ladeWP(); ladeWPS(); ladeML();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){ladeEinkauf();ladeEnergie();ladeDiesel(false);ladeSchein();ladeWP();ladeWPS();ladeML()}});
})();
